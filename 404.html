<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Up Hackathon Rivals</title>
  <meta http-equiv="refresh" content="3; url=./index.html" />
  <style>
    :root {
      --primary: #5b4ef5;
      --dark: #0f172a;
      --bg: #f5f7ff;
      --text: #475569;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      font-family: Inter, Arial, sans-serif;
      color: var(--dark);
    }

    .card {
      width: min(90vw, 560px);
      background: rgba(255,255,255,0.96);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 24px 50px rgba(15,23,42,0.09);
      padding: 32px 28px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(91, 78, 245, 0.1);
      color: var(--primary);
      font-weight: 800;
      border-radius: 999px;
      padding: 8px 14px;
      margin-bottom: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.74rem;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0 0 18px;
      color: var(--text);
      font-size: 1rem;
    }

    a {
      display: inline-block;
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist. Redirecting to the homepage...</p>
    <a href="./index.html">Go to Homepage</a>
  </div>
</body>
</html>
