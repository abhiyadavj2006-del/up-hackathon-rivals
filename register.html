<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Up Hackathon Rivals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 36px 16px;
    }

    .auth-card {
      width: min(100%, 620px);
      background: rgba(255,255,255,0.96);
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.09);
      padding: 34px 28px;
    }

    .auth-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .auth-card h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .auth-card p {
      margin-bottom: 24px;
    }

    .register-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group.full {
      grid-column: 1 / -1;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 600;
    }

    .input-group input,
    .input-group select,
    .input-group textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      resize: vertical;
    }

    .auth-submit {
      width: 100%;
      margin-top: 8px;
      border: none;
      cursor: pointer;
    }

    .otp-box {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .otp-box.visible {
      display: block;
    }

    .otp-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .otp-actions button {
      flex: 1;
    }

    .status-text {
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--text);
    }

    .status-text.success {
      color: var(--success);
    }

    .status-text.error {
      color: #dc2626;
    }

    @media (max-width: 600px) {
      .register-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-top">
        <div class="auth-badge" style="display:flex;align-items:center;gap:10px;font-weight:800;">
          <div class="logo-mark">UP</div>
          <span>Up Hackathon Rivals</span>
        </div>
        <a href="index.html" class="auth-link" style="color:var(--primary);font-weight:700;">Back to home</a>
      </div>

      <h1>Create your account</h1>
      <p>Join the national innovation challenge and build the next big thing.</p>

      <form class="register-form auth-form" style="margin-top:12px;">
        <div class="register-grid">
          <div class="input-group">
            <label for="reg-name">Full Name</label>
            <input id="reg-name" type="text" placeholder="Your full name" required />
          </div>

          <div class="input-group">
            <label for="reg-email">Email</label>
            <input id="reg-email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="input-group">
            <label for="reg-college">College / Organization</label>
            <input id="reg-college" type="text" placeholder="Your institution" required />
          </div>

          <div class="input-group">
            <label for="reg-phone">Phone Number</label>
            <input id="reg-phone" type="tel" placeholder="+91 98765 43210" required />
          </div>

          <div class="input-group full">
            <label for="reg-track">Preferred Track</label>
            <select id="reg-track">
              <option>AI & Automation</option>
              <option>HealthTech</option>
              <option>Sustainability</option>
              <option>Smart Infrastructure</option>
              <option>Space & Defense</option>
              <option>Culture & Heritage</option>
            </select>
          </div>

          <div class="input-group full">
            <label for="reg-summary">Team Summary</label>
            <textarea id="reg-summary" rows="4" placeholder="Tell us about your idea or team focus..."></textarea>
          </div>
        </div>

        <div class="otp-box" id="register-otp-box">
          <div class="input-group">
            <label for="register-otp">Enter OTP</label>
            <input id="register-otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" />
          </div>
          <div class="otp-actions">
            <button type="submit" class="btn-primary" data-action="verify-register">Verify OTP</button>
            <button type="button" class="btn-secondary" data-action="resend-register">Resend</button>
          </div>
          <div class="status-text" id="register-status"></div>
        </div>

        <button type="submit" class="btn-primary auth-submit" data-action="send-register-otp">Submit Registration</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
