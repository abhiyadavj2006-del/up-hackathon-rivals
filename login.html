<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Up Hackathon Rivals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .auth-card {
      width: min(100%, 480px);
      background: rgba(255,255,255,0.92);
      border: 1px solid #e2e8f0;
      border-radius: 26px;
      box-shadow: 0 25px 55px rgba(15, 23, 42, 0.09);
      padding: 34px 28px;
    }

    .auth-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--dark);
    }

    .auth-card h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .auth-card p {
      margin-bottom: 24px;
    }

    .auth-form .input-group {
      margin-bottom: 18px;
    }

    .auth-form label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark);
      font-weight: 600;
    }

    .auth-form input {
      width: 100%;
      border: 1px solid var(--line);
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
    }

    .auth-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 20px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-link {
      color: var(--primary);
      font-weight: 700;
    }

    .auth-cta {
      width: 100%;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }

    .otp-box {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .otp-box.visible {
      display: block;
    }

    .otp-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .otp-actions button {
      flex: 1;
    }

    .status-text {
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--text);
    }

    .status-text.success {
      color: var(--success);
    }

    .status-text.error {
      color: #dc2626;
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      color: var(--text);
      font-size: 0.95rem;
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-top">
        <div class="auth-badge">
          <div class="logo-mark">UP</div>
          <span>Up Hackathon Rivals</span>
        </div>
        <a href="index.html" class="auth-link"><i class="fas fa-arrow-left"></i> Back</a>
      </div>

      <h1>Welcome back</h1>
      <p>Sign in to manage your team, ideas, and challenge progress.</p>

      <form class="auth-form login-form">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="name@example.com" required />
        </div>

        <div class="otp-box" id="login-otp-box">
          <div class="input-group">
            <label for="login-otp">Enter OTP</label>
            <input id="login-otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code" />
          </div>
          <div class="otp-actions">
            <button type="submit" class="btn-primary" data-action="verify-login">Verify OTP</button>
            <button type="button" class="btn-secondary" data-action="resend-login">Resend</button>
          </div>
          <div class="status-text" id="login-status"></div>
        </div>

        <div class="auth-row">
          <label class="remember"><input type="checkbox" /> Remember me</label>
          <a href="mailto:abhiyadavj2006@gmail.com?subject=Password%20Reset%20Request" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary auth-cta" data-action="send-login-otp">Send OTP</button>
      </form>

      <div class="auth-footer">
        Don’t have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
